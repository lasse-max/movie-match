<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Movie Match share card</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Courier+Prime:wght@400;700&family=Libre+Franklin:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2E8D5;color:#0E0A09;font-family:'Libre Franklin','Franklin Gothic Medium','Helvetica Neue',Arial,sans-serif}
a{color:#B8141E}a:hover{color:#6E0B12}
.display{font-family:'Big Shoulders Display','Oswald','Arial Narrow',sans-serif;font-weight:900;text-transform:uppercase}
.mono{font-family:'Courier Prime','Courier New',monospace;text-transform:uppercase;letter-spacing:.24em;font-size:11px;font-weight:700}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.13;mix-blend-mode:multiply}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 693px; box-sizing: border-box; overflow: hidden; background: #F2E8D5; color: #0E0A09; padding: 16px; display: flex; flex-direction: column; gap: 12px">
  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; gap: 11px; padding: 14px; box-shadow: inset 0 0 0 2px #0E0A09">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span class="mono">Tonight's feature</span>
      <span class="mono">[Date]</span>
    </div>
    <div style="position: relative; height: 236px; flex: none; overflow: hidden; background: #F0B7C0">
      <div style="position: absolute; left: 9%; top: 11%; width: 160px; height: 160px; border-radius: 50%; background: #E3312D"></div>
      <div style="position: absolute; left: 35%; top: 20%; width: 160px; height: 160px; border-radius: 50%; background: #7A8B4F; mix-blend-mode: multiply"></div>
      <div style="position: absolute; left: 70%; top: 7%; width: 28px; height: 54px; border-radius: 50% 50% 50% 50%/70% 70% 30% 30%; background: #0E0A09; transform: rotate(28deg)"></div>
      <span class="mono" style="position: absolute; left: 10px; bottom: 10px; font-size: 9px; letter-spacing: 0.2em; color: #0E0A09">[TMDB poster]</span>
    </div>
    <h1 class="display" style="margin: 0; font-size: 82px; line-height: 0.8; letter-spacing: -0.01em; color: #B8141E">Neon<br>Orchard</h1>
    <p style="margin: 0; font-size: 15px; font-style: italic; color: #3A2C26">Some things only grow in the heat.</p>
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
      <div style="display: grid; grid-template-columns: auto 1fr; gap: 5px 14px">
        <span class="mono" style="font-size: 10px; color: #6B5A50">Year</span><span class="mono" style="font-size: 10px">2022</span>
        <span class="mono" style="font-size: 10px; color: #6B5A50">Genre</span><span class="mono" style="font-size: 10px">Romance, comedy</span>
        <span class="mono" style="font-size: 10px; color: #6B5A50">Runtime</span><span class="mono" style="font-size: 10px">104 min</span>
        <span class="mono" style="font-size: 10px; color: #6B5A50">Watch on</span><span class="mono" style="font-size: 10px">Netflix</span>
      </div>
      <div style="width: 84px; height: 84px; flex: none; border-radius: 50%; background: #D6A24A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transform: rotate(-12deg); box-shadow: inset 0 0 0 3px #0E0A09, inset 0 0 0 5px #D6A24A, inset 0 0 0 6px #0E0A09">
        <span class="display" style="font-size: 30px; line-height: 1">88%</span>
        <span class="mono" style="font-size: 9px; letter-spacing: 0.2em">Match</span>
      </div>
    </div>
    <div style="display: flex; height: 16px; flex: none">
      <span style="flex-grow: 1; background: #F0B7C0; box-shadow: inset 0 0 0 1px rgba(14,10,9,0.25)"></span>
      <span style="flex-grow: 1; background: #E3312D"></span>
      <span style="flex-grow: 1; background: #7A8B4F"></span>
      <span style="flex-grow: 1; background: #3B2A1E"></span>
      <span style="flex-grow: 1; background: #0E0A09"></span>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: #0E0A09; color: #F2E8D5; flex: none">
    <span class="mono" style="font-size: 10px">Picked by two on Movie Match</span>
    <span class="mono" style="font-size: 10px; color: #D6A24A; letter-spacing: 0.12em">[moviematch.app]</span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="mmgrain2"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#mmgrain2)"></rect></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":693}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
